<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MindVault logo">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="200" height="200" rx="44" fill="#070712"/>
  <rect x="1" y="1" width="198" height="198" rx="43" fill="none" stroke="#22C55E" stroke-opacity="0.18"/>
  <circle cx="100" cy="100" r="78" fill="url(#glow)"/>

  <!-- vault / shield body -->
  <path d="M100 34 L150 52 V104 C150 134 128 156 100 168 C72 156 50 134 50 104 V52 Z"
        fill="#0D0D1C" stroke="url(#lg)" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- memory / knowledge-graph network inside (the "mind") -->
  <g stroke="#22C55E" stroke-opacity="0.55" stroke-width="1.6">
    <line x1="100" y1="74" x2="76" y2="98"/>
    <line x1="100" y1="74" x2="124" y2="98"/>
    <line x1="76" y1="98" x2="100" y2="124"/>
    <line x1="124" y1="98" x2="100" y2="124"/>
    <line x1="76" y1="98" x2="124" y2="98"/>
    <line x1="100" y1="124" x2="100" y2="146"/>
  </g>
  <g fill="url(#lg)">
    <circle cx="100" cy="74" r="6.5"/>
    <circle cx="76" cy="98" r="5.5"/>
    <circle cx="124" cy="98" r="5.5"/>
    <circle cx="100" cy="124" r="6"/>
    <circle cx="100" cy="146" r="4.5"/>
  </g>
  <g fill="#86EFAC" filter="url(#soft)" opacity="0.9">
    <circle cx="100" cy="74" r="3"/>
    <circle cx="100" cy="124" r="3"/>
  </g>
</svg>
