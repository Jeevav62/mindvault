<svg width="1280" height="380" viewBox="0 0 1280 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MindVault — a RAG chatbot that remembers you">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070712"/>
      <stop offset="0.55" stop-color="#0A0A1A"/>
      <stop offset="1" stop-color="#070712"/>
    </linearGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ECEDF5"/>
      <stop offset="0.55" stop-color="#86EFAC"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#22C55E" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridFade" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gm"><rect width="1280" height="380" fill="url(#gridFade)"/></mask>
  </defs>

  <rect width="1280" height="380" fill="url(#bgGrad)"/>
  <rect width="1280" height="380" fill="url(#grid)" mask="url(#gm)"/>
  <ellipse cx="930" cy="190" rx="430" ry="300" fill="url(#halo)"/>

  <!-- particle / knowledge-graph network on the right -->
  <g stroke="#22C55E" stroke-opacity="0.30" stroke-width="1.3">
    <line x1="980" y1="90" x2="1080" y2="150"/>
    <line x1="1080" y1="150" x2="1010" y2="240"/>
    <line x1="1010" y1="240" x2="920" y2="200"/>
    <line x1="920" y1="200" x2="980" y2="90"/>
    <line x1="1080" y1="150" x2="1170" y2="110"/>
    <line x1="1080" y1="150" x2="1160" y2="230"/>
    <line x1="1010" y1="240" x2="1090" y2="300"/>
    <line x1="920" y1="200" x2="860" y2="280"/>
    <line x1="980" y1="90" x2="900" y2="120"/>
  </g>
  <g fill="url(#lg2)">
    <circle cx="980" cy="90" r="6"/>
    <circle cx="1080" cy="150" r="8"/>
    <circle cx="1010" cy="240" r="6.5"/>
    <circle cx="920" cy="200" r="5.5"/>
    <circle cx="1170" cy="110" r="5"/>
    <circle cx="1160" cy="230" r="5.5"/>
    <circle cx="1090" cy="300" r="5"/>
    <circle cx="860" cy="280" r="4.5"/>
    <circle cx="900" cy="120" r="4"/>
  </g>

  <!-- vault mark on the left -->
  <g transform="translate(92 116)">
    <path d="M74 0 L138 22 V92 C138 132 110 162 74 178 C38 162 10 132 10 92 V22 Z"
          transform="scale(0.78)" fill="#0D0D1C" stroke="url(#lg2)" stroke-width="3.5" stroke-linejoin="round"/>
    <g transform="scale(0.78)">
      <g stroke="#22C55E" stroke-opacity="0.55" stroke-width="1.6">
        <line x1="74" y1="48" x2="50" y2="74"/>
        <line x1="74" y1="48" x2="98" y2="74"/>
        <line x1="50" y1="74" x2="74" y2="102"/>
        <line x1="98" y1="74" x2="74" y2="102"/>
        <line x1="50" y1="74" x2="98" y2="74"/>
      </g>
      <g fill="url(#lg2)">
        <circle cx="74" cy="48" r="6"/>
        <circle cx="50" cy="74" r="5"/>
        <circle cx="98" cy="74" r="5"/>
        <circle cx="74" cy="102" r="5.5"/>
      </g>
    </g>
  </g>

  <!-- wordmark + tagline -->
  <text x="240" y="178" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="76" font-weight="700" fill="url(#wm)" letter-spacing="-1">MindVault</text>
  <text x="242" y="224" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="25" font-weight="500" fill="#9BA3C0">A RAG chatbot that remembers you.</text>

  <!-- feature chips -->
  <g font-family="'JetBrains Mono',monospace" font-size="15" font-weight="600">
    <g transform="translate(242 252)">
      <rect width="150" height="34" rx="17" fill="#0D0D1C" stroke="#22C55E" stroke-opacity="0.30"/>
      <circle cx="22" cy="17" r="3.5" fill="#22C55E"/>
      <text x="36" y="22" fill="#86EFAC">Multimodal RAG</text>
    </g>
    <g transform="translate(404 252)">
      <rect width="168" height="34" rx="17" fill="#0D0D1C" stroke="#22C55E" stroke-opacity="0.30"/>
      <circle cx="22" cy="17" r="3.5" fill="#22C55E"/>
      <text x="36" y="22" fill="#86EFAC">Persistent Memory</text>
    </g>
    <g transform="translate(584 252)">
      <rect width="186" height="34" rx="17" fill="#0D0D1C" stroke="#22C55E" stroke-opacity="0.30"/>
      <circle cx="22" cy="17" r="3.5" fill="#22C55E"/>
      <text x="36" y="22" fill="#86EFAC">AES-256 Encrypted</text>
    </g>
    <g transform="translate(782 252)">
      <rect width="150" height="34" rx="17" fill="#0D0D1C" stroke="#22C55E" stroke-opacity="0.30"/>
      <circle cx="22" cy="17" r="3.5" fill="#22C55E"/>
      <text x="36" y="22" fill="#86EFAC">Voice + TTS</text>
    </g>
  </g>
</svg>
